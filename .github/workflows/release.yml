name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tarball
        run: |
          tar --exclude-vcs --exclude='.github' -czf grok-fusion-connector.tar.gz \
            mcp-client fusion-addin installers LICENSE README.md .gitignore

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: grok-fusion-connector.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
